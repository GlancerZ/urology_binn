[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-discrete-research"
version = "0.2.0"
description = "Internal reproducible experiment framework for discrete-time Teacher and Student MAPS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.0"]
test = ["pytest>=8.0"]

[project.scripts]
maps-research = "maps_discrete.cli:main"
maps-run-teacher-student-batch = "maps_discrete.batch_runner:main"
maps-run-ml-batch = "maps_discrete.ml_batch_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
